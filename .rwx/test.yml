base:
  image: ruby:${{ init.ruby-version }}
  config: none

tasks:
  - key: code
    run: |
      git init -q .
      git fetch -q --depth 1 https://github.com/selectiveci/selective-ruby-minitest.git ${{ init.commit-sha }}
      git checkout -q FETCH_HEAD

  - key: bundle-install
    use: code
    run: |
      ruby -v
      bundle install
      grep "^    minitest " Gemfile.lock
    env:
      MINITEST_VERSION: ${{ init.minitest-version }}

  - key: rspec
    use: bundle-install
    run: bundle exec rspec
    env:
      MINITEST_VERSION: ${{ init.minitest-version }}
