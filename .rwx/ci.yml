on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
  github:
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}

tasks:
  - key: tests
    parallel:
      matrix:
        ruby-version: ["2.7.8", "3.0.7", "3.1.7", "3.2.9", "3.3.10", "3.4.9", "4.0.7"]
    call: ${{ run.dir }}/test.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      ruby-version: ${{ parallel.ruby-version }}
      minitest-version: "~> 5.0"

  - key: tests-minitest-6
    parallel:
      matrix:
        ruby-version: ["3.2.9", "3.3.10", "3.4.9", "4.0.7"]
    call: ${{ run.dir }}/test.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      ruby-version: ${{ parallel.ruby-version }}
      minitest-version: "~> 6.0"

  - key: tests-minitest-floor
    parallel:
      matrix:
        ruby-version: ["2.7.8", "3.0.7", "3.1.7", "3.2.9", "3.3.10", "3.4.9"]
    call: ${{ run.dir }}/test.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      ruby-version: ${{ parallel.ruby-version }}
      minitest-version: "= 5.16.0"
